<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real Coin Flip Game</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #111, #222);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 40px;
    }

    .coin {
      width: 180px;
      height: 180px;
      margin: auto;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: absolute;
      backface-visibility: hidden;
    }

    .tails {
      transform: rotateY(180deg);
    }

    .flip-heads {
      animation: flipHeads 2s forwards;
    }

    .flip-tails {
      animation: flipTails 2s forwards;
    }

    @keyframes flipHeads {
      from {
        transform: rotateY(0);
      }
      to {
        transform: rotateY(1800deg);
      }
    }

    @keyframes flipTails {
      from {
        transform: rotateY(0);
      }
      to {
        transform: rotateY(1980deg);
      }
    }

    button {
      margin-top: 40px;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: gold;
      color: black;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #result {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      opacity: 0;
      transition: 0.5s;
    }

    #result.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🪙 Real Coin Flip</h1>

    <div class="coin" id="coin">

      <!-- HEAD -->
      <img src="https://i.imgur.com/7D7I6dI.png" alt="Heads">

      <!-- TAIL -->
      <img src="https://i.imgur.com/9R7sQjK.png" class="tails" alt="Tails">

    </div>

    <button onclick="flipCoin()">Flip Coin</button>

    <div id="result">Click Flip</div>

  </div>

  <script>
    function flipCoin() {

      const coin = document.getElementById("coin");
      const result = document.getElementById("result");

      const random = Math.random();

      coin.classList.remove("flip-heads");
      coin.classList.remove("flip-tails");

      void coin.offsetWidth;

      result.classList.remove("show");

      if(random < 0.5){
        coin.classList.add("flip-heads");

        setTimeout(() => {
          result.innerText = "🟡 Heads!";
          result.classList.add("show");
        }, 2000);

      } else {

        coin.classList.add("flip-tails");

        setTimeout(() => {
          result.innerText = "🟠 Tails!";
          result.classList.add("show");
        }, 2000);
      }
    }
  </script>

</body>
</html>
