<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Real Coin Flip</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

      overflow:hidden;

      background:
      radial-gradient(circle at top,#444,#111);

      font-family:Arial,sans-serif;

      perspective:1800px;

      color:white;
    }

    .container{
      width:100%;
      max-width:420px;

      display:flex;
      flex-direction:column;

      justify-content:center;
      align-items:center;

      text-align:center;
    }

    h1{
      font-size:42px;

      margin-bottom:35px;

      color:gold;

      text-shadow:
      0 0 12px gold,
      0 0 30px rgba(255,215,0,0.5);
    }

    /* COIN AREA */

    .coin-box{
      width:min(65vw,240px);
      height:min(65vw,240px);

      display:flex;
      justify-content:center;
      align-items:center;

      position:relative;

      margin:auto;
    }

    .coin{
      width:100%;
      height:100%;

      position:relative;

      display:flex;
      justify-content:center;
      align-items:center;

      transform-style:preserve-3d;
    }

    .coin img{
      width:100%;
      height:100%;

      position:absolute;

      border-radius:50%;

      object-fit:contain;

      backface-visibility:hidden;

      mix-blend-mode:screen;

      filter:
      drop-shadow(0 0 12px gold)
      drop-shadow(0 0 30px rgba(255,215,0,0.5));
    }

    /* BACK */

    .tails{
      transform:rotateX(180deg);
    }

    /* ANIMATION */

    .flip-heads{
      animation:flipHeads 3s ease-out forwards;
    }

    .flip-tails{
      animation:flipTails 3s ease-out forwards;
    }

    @keyframes flipHeads{

      0%{
        transform:
        rotateX(0deg)
        translateY(0px);
      }

      25%{
        transform:
        rotateX(900deg)
        translateY(-140px);
      }

      50%{
        transform:
        rotateX(1800deg)
        translateY(-230px);
      }

      75%{
        transform:
        rotateX(2700deg)
        translateY(-120px);
      }

      100%{
        transform:
        rotateX(3600deg)
        translateY(0px);
      }
    }

    @keyframes flipTails{

      0%{
        transform:
        rotateX(0deg)
        translateY(0px);
      }

      25%{
        transform:
        rotateX(1080deg)
        translateY(-140px);
      }

      50%{
        transform:
        rotateX(2160deg)
        translateY(-230px);
      }

      75%{
        transform:
        rotateX(3240deg)
        translateY(-120px);
      }

      100%{
        transform:
        rotateX(3780deg)
        translateY(0px);
      }
    }

    /* BUTTON */

    button{
      margin-top:45px;

      padding:15px 40px;

      border:none;
      border-radius:14px;

      background:gold;

      color:black;

      font-size:22px;
      font-weight:bold;

      cursor:pointer;

      transition:0.3s;

      box-shadow:
      0 0 15px rgba(255,215,0,0.6);
    }

    button:hover{
      transform:scale(1.06);
    }

    button:active{
      transform:scale(0.95);
    }

    /* RESULT */

    #result{
      margin-top:30px;

      font-size:32px;
      font-weight:bold;

      opacity:0;

      transform:translateY(15px);

      transition:0.5s;

      text-shadow:
      0 0 10px gold;
    }

    #result.show{
      opacity:1;
      transform:translateY(0px);
    }

    /* MOBILE */

    @media(max-width:600px){

      h1{
        font-size:34px;
      }

      button{
        font-size:18px;
        padding:14px 28px;
      }

      #result{
        font-size:26px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>🪙 Real Coin Flip</h1>

    <div class="coin-box">

      <div class="coin" id="coin">

        <!-- HEAD -->

        <img
        src="https://files.catbox.moe/7ft64i.png"
        alt="Heads">

        <!-- TAIL -->

        <img
        src="https://files.catbox.moe/qmv8dp.png"
        class="tails"
        alt="Tails">

      </div>

    </div>

    <!-- BUTTON -->

    <button onclick="flipCoin()">
      Flip Coin
    </button>

    <!-- RESULT -->

    <div id="result">
      Click Flip
    </div>

  </div>

  <!-- SOUND -->

  <audio id="flipSound">

    <source
    src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"
    type="audio/mpeg">

  </audio>

  <script>

    function flipCoin(){

      const coin =
      document.getElementById("coin");

      const result =
      document.getElementById("result");

      const sound =
      document.getElementById("flipSound");

      const random =
      Math.random();

      /* RESET */

      coin.classList.remove(
      "flip-heads",
      "flip-tails"
      );

      void coin.offsetWidth;

      result.classList.remove("show");

      /* PLAY SOUND */

      sound.currentTime = 0;

      sound.play();

      /* RANDOM RESULT */

      if(random < 0.5){

        coin.classList.add(
        "flip-heads"
        );

        setTimeout(()=>{

          result.innerText =
          "🟡 Heads!";

          result.classList.add(
          "show"
          );

        },3000);

      }else{

        coin.classList.add(
        "flip-tails"
        );

        setTimeout(()=>{

          result.innerText =
          "🟠 Tails!";

          result.classList.add(
          "show"
          );

        },3000);
      }
    }

  </script>

</body>
</html>
