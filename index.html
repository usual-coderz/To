<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Coin Toss Betting Game</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      background:
      radial-gradient(circle at top,#3b3b3b,#111);

      color:white;

      perspective:1400px;
    }

    /* WALLET */

    .wallet{
      position:fixed;

      top:20px;
      right:20px;

      background:#1d1d1d;

      border:2px solid gold;

      padding:12px 20px;

      border-radius:14px;

      font-size:20px;
      font-weight:bold;

      color:gold;

      box-shadow:
      0 0 15px rgba(255,215,0,0.5);
    }

    .container{
      width:100%;
      max-width:450px;

      text-align:center;

      padding:20px;
    }

    h1{
      font-size:40px;

      margin-bottom:35px;

      color:gold;

      text-shadow:
      0 0 10px gold;
    }

    /* COIN */

    .coin-box{
      width:220px;
      height:220px;

      margin:auto;

      display:flex;
      justify-content:center;
      align-items:center;

      position:relative;
    }

    .coin{
      width:100%;
      height:100%;

      position:relative;

      transform-style:preserve-3d;
    }

    .coin img{
      width:100%;
      height:100%;

      position:absolute;

      border-radius:50%;

      object-fit:contain;

      backface-visibility:hidden;

      filter:
      drop-shadow(0 0 12px gold)
      drop-shadow(0 0 25px rgba(255,215,0,0.4));
    }

    .tails{
      transform:rotateX(180deg);
    }

    /* REALISTIC TOSS */

    .flip-heads{
      animation:realHeads 2s ease-out forwards;
    }

    .flip-tails{
      animation:realTails 2s ease-out forwards;
    }

    @keyframes realHeads{

      0%{
        transform:
        rotateX(0deg)
        translateY(0);
      }

      30%{
        transform:
        rotateX(720deg)
        translateY(-120px);
      }

      60%{
        transform:
        rotateX(1260deg)
        translateY(-180px);
      }

      100%{
        transform:
        rotateX(1800deg)
        translateY(0);
      }
    }

    @keyframes realTails{

      0%{
        transform:
        rotateX(0deg)
        translateY(0);
      }

      30%{
        transform:
        rotateX(900deg)
        translateY(-120px);
      }

      60%{
        transform:
        rotateX(1620deg)
        translateY(-180px);
      }

      100%{
        transform:
        rotateX(1980deg)
        translateY(0);
      }
    }

    /* BET BOX */

    .bet-box{
      margin-top:40px;
    }

    input{
      width:220px;

      padding:14px;

      border:none;
      outline:none;

      border-radius:12px;

      font-size:18px;

      text-align:center;

      background:#222;

      color:white;

      border:2px solid gold;
    }

    .buttons{
      margin-top:20px;

      display:flex;
      justify-content:center;
      gap:15px;
    }

    button{
      padding:14px 28px;

      border:none;

      border-radius:12px;

      background:gold;

      color:black;

      font-size:18px;
      font-weight:bold;

      cursor:pointer;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    button:active{
      transform:scale(0.95);
    }

    /* RESULT */

    #result{
      margin-top:35px;

      font-size:30px;
      font-weight:bold;

      opacity:0;

      transition:0.4s;
    }

    #result.show{
      opacity:1;
    }

    /* MOBILE */

    @media(max-width:600px){

      h1{
        font-size:32px;
      }

      .coin-box{
        width:180px;
        height:180px;
      }

      input{
        width:180px;
      }

      button{
        padding:12px 20px;
        font-size:16px;
      }

      #result{
        font-size:24px;
      }

      .wallet{
        font-size:16px;
      }
    }

  </style>
</head>

<body>

  <!-- WALLET -->

  <div class="wallet">
    🪙 Wallet:
    <span id="wallet">5000</span>
  </div>

  <div class="container">

    <h1>🪙 Coin Toss</h1>

    <!-- COIN -->

    <div class="coin-box">

      <div class="coin" id="coin">

        <img
        src="https://files.catbox.moe/7ft64i.png"
        alt="Heads">

        <img
        src="https://files.catbox.moe/qmv8dp.png"
        class="tails"
        alt="Tails">

      </div>

    </div>

    <!-- BET -->

    <div class="bet-box">

      <input
      type="number"
      id="betAmount"
      placeholder="Enter Bet (10 - 10000)">

      <div class="buttons">

        <button onclick="flipCoin('Heads')">
          Heads
        </button>

        <button onclick="flipCoin('Tails')">
          Tails
        </button>

      </div>

    </div>

    <!-- RESULT -->

    <div id="result">
      Place Your Bet
    </div>

  </div>

  <!-- SOUND -->

  <audio id="flipSound">

    <source
    src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"
    type="audio/mpeg">

  </audio>

  <script>

    let wallet = 5000;

    function flipCoin(choice){

      const bet =
      parseInt(
      document.getElementById(
      "betAmount"
      ).value);

      const walletText =
      document.getElementById(
      "wallet"
      );

      const coin =
      document.getElementById(
      "coin"
      );

      const result =
      document.getElementById(
      "result"
      );

      const sound =
      document.getElementById(
      "flipSound"
      );

      /* VALIDATION */

      if(isNaN(bet)){

        alert("Enter Bet Amount");
        return;
      }

      if(bet < 10){

        alert("Minimum Bet is 10");
        return;
      }

      if(bet > 10000){

        alert("Maximum Bet is 10000");
        return;
      }

      if(bet > wallet){

        alert("Not Enough Coins");
        return;
      }

      /* RESET */

      coin.classList.remove(
      "flip-heads",
      "flip-tails"
      );

      void coin.offsetWidth;

      result.classList.remove(
      "show"
      );

      /* PLAY SOUND */

      sound.currentTime = 0;
      sound.play();

      /* RANDOM */

      const random =
      Math.random() < 0.5
      ? "Heads"
      : "Tails";

      /* ANIMATION */

      if(random === "Heads"){

        coin.classList.add(
        "flip-heads"
        );

      }else{

        coin.classList.add(
        "flip-tails"
        );
      }

      /* RESULT */

      setTimeout(()=>{

        if(choice === random){

          wallet += bet;

          result.innerHTML =
          "🎉 You Won +"
          + bet;

        }else{

          wallet -= bet;

          result.innerHTML =
          "❌ You Lost -"
          + bet;
        }

        walletText.innerText =
        wallet;

        result.classList.add(
        "show"
        );

      },2000);

    }

  </script>

</body>
</html>
